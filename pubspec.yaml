name: mod
description: Flutter base project — Clean Architecture, BLoC, flavors, l10n and tests.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localization / formatting
  intl: ^0.20.3

  # State management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1

  # Dependency injection
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Navigation
  go_router: ^18.1.1

  # Networking
  dio: ^5.11.1
  retrofit: ^4.10.0
  pretty_dio_logger: ^1.4.0

  # Models / functional
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  fpdart: ^1.2.0

  # Storage
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.15.2
  retrofit_generator: ^10.3.2
  injectable_generator: ^3.1.3

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
